name: Auto Docker Build & Push

on:
  push:
    paths:
      - 'dockerfiles/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Debug modified files
        run: |
          echo "Archivos modificados: ${{ github.event.head_commit.modified }}"
                
      - name: Build and push modified Dockerfiles
        run: |
          # Obtener lista de Dockerfiles modificados en el último commit
          CHANGED=$(echo "${{ github.event.head_commit.modified }}" | tr ',' '\n' | grep '^dockerfiles/Dockerfile' || true)
          
          if [ -z "$CHANGED" ]; then
            echo "⚠️ No se encontraron Dockerfiles modificados. Finalizando."
            exit 0
          fi
          
          for file in $CHANGED; do
            base=$(basename "$file")        # Dockerfile.front
            name="${base#Dockerfile.}"      # front
            tag="galarconm/tfm:$name-latest"

            echo "➡️ Construyendo y subiendo $file como $tag"

            docker build -f $file -t $tag dockerfiles
            docker push $tag
          done