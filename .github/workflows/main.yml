name: Auto Docker Build & Push

on:
  push:
    paths:
      - 'dockerfiles/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push modified Dockerfiles
        run: |
          # Obtener lista de Dockerfiles modificados
          CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep '^dockerfiles/Dockerfile' || true)
          
          for file in $CHANGED; do
            base=$(basename "$file")        # Dockerfile.front
            name="${base#Dockerfile.}"      # front
            tag="galarconm/$name:latest"

            echo "➡️ Construyendo y subiendo $file como $tag"

            docker build -f $file -t $tag dockerfiles
            docker push $tag
          done
