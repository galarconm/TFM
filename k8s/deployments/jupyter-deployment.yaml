apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupyter-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jupyter-dep-pod
  template:
    metadata:
      labels:
        app: jupyter-dep-pod
    spec:
      containers:
      - name: jupyter
        image: galarconm/tfm:jupyter-rdp-v1
        ports:
        - containerPort: 3389
        volumeMounts:
        - name: jupyter-data
          mountPath: /home
      volumes:
      - name: jupyter-data
        persistentVolumeClaim:
          claimName: home-pvc
