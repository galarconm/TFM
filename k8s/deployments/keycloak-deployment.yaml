apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak-dep-pod
  template:
    metadata:
      labels:
        app: keycloak-dep-pod
    spec:
      containers:
        - name: keycloak-container
          image: galarconm/tfm:keycloak-v1
          ports:
          - containerPort: 8080
          env:
          - name: KEYCLOAK_ADMIN
            value: admin
          - name: KEYCLOAK_ADMIN_PASSWORD
            value: admin
          - name: KC_DB
            value: postgres
          - name: KC_DB_URL
            value: jdbc:postgresql://postgres-svc:5432/keycloak_db
          - name: KC_DB_USERNAME
            value: keycloak_user
          - name: KC_DB_PASSWORD
            value: keycloak_password
          - name: KC_HOSTNAME
            value: "192.168.49.2" # es la IP del host o nodo maestro.
